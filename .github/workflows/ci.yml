name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository skeleton
        run: bash scripts/validate-skeleton.sh

      - name: Verify no REST API is claimed
        run: test ! -e openapi/openapi.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios-feasibility:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, xcode-27-beta]
    steps:
      - name: Checkout trusted revision
        shell: bash
        env:
          COP_MOBILE_GIT_URL: git@github.com:${{ github.repository }}.git
        run: |
          set -euo pipefail
          if [[ ! -d .git ]]; then
            git init .
            git remote add origin "$COP_MOBILE_GIT_URL"
          else
            git remote set-url origin "$COP_MOBILE_GIT_URL"
          fi
          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=8' \
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Verify approved Xcode 27 beta
        run: bash scripts/verify-apple-toolchain.sh

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Validate pinned contract and configuration
        run: |
          python3 scripts/validate-device-contract.py
          python3 scripts/validate-ios-project.py

      - name: Build and test iOS 26 host
        run: bash scripts/test-ios.sh

  # Add Android Gradle jobs only when the Android phase starts.
