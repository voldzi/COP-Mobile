name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository skeleton
        run: bash scripts/validate-skeleton.sh

      - name: Verify no REST API is claimed
        run: test ! -e openapi/openapi.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios-feasibility:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select approved stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          bash scripts/verify-stable-apple-toolchain.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate pinned contract and configuration
        run: |
          python3 scripts/validate-device-contract.py
          python3 scripts/validate-ios-project.py

      - name: Build and test iOS 26 host
        run: bash scripts/test-ios.sh

  # Add Android Gradle jobs only when the Android phase starts.
